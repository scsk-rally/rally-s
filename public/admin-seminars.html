<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="会員サイトのセミナー投稿を管理します。">
<title>セミナー投稿 | rally 資産形成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/admin-guard.js"></script>
</head>
<body class="admin-body" data-content-type="seminar">
  <header class="admin-header">
    <a href="admin.html" class="admin-header__logo" aria-label="管理トップへ"><img src="images/rally-logo.png" data-site-logo alt="rally 資産形成"></a>
    <div class="admin-header__actions">
      <a class="admin-header__back" href="admin.html"><span aria-hidden="true">←</span> 管理トップへ</a>
      <a class="admin-header__settings" href="admin-settings.html" aria-label="管理者設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.86 2.86-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21H9.6v-.09A1.7 1.7 0 0 0 8.5 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.86-2.86.06-.06A1.7 1.7 0 0 0 4.1 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H2.3V9.6h.09A1.7 1.7 0 0 0 4.1 8.5a1.7 1.7 0 0 0-.34-1.88l-.06-.06L6.56 3.7l.06.06A1.7 1.7 0 0 0 8.5 4.1a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V2.3h4v.09A1.7 1.7 0 0 0 15 4.1a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.86 2.86-.06.06A1.7 1.7 0 0 0 19.4 8.5a1.7 1.7 0 0 0 .6 1 1.7 1.7 0 0 0 1.1.4h.09v4h-.09A1.7 1.7 0 0 0 19.4 15Z"/></svg><span>設定</span></a>
      <button class="admin-header__logout" id="adminLogout" type="button">ログアウト</button>
    </div>
  </header>
  <main class="admin-main">
    <div class="admin-title">
      <div><span>SEMINAR MANAGEMENT</span><h1>セミナー投稿</h1><p>開催情報と画像を登録し、セミナーページへ最大5件表示します。</p></div>
      <div class="admin-title__note"><span><strong>最大5件</strong>表示切替と公開開始・終了日時を設定できます。</span></div>
    </div>
    <div class="admin-layout">
      <section class="admin-panel admin-panel--form">
        <div class="admin-panel__head"><span class="admin-panel__icon">＋</span><div><small>ADD / EDIT</small><h2>セミナーを登録</h2></div></div>
        <form id="contentForm" novalidate>
          <label class="admin-field" for="contentTitle"><span>セミナータイトル</span><input id="contentTitle" name="title" type="text" required></label>
          <label class="admin-field" for="contentSummary"><span>概要 <small>お知らせ連動時は50文字以内</small></span><textarea id="contentSummary" name="summary" rows="3"></textarea></label>
          <div class="admin-schedule-fields">
            <label class="admin-field" for="contentEventDate"><span>開催日</span><input id="contentEventDate" name="eventDate" type="date" required></label>
            <label class="admin-field" for="contentEventTime"><span>開催時間</span><input id="contentEventTime" name="eventTime" type="text" placeholder="12:00〜12:50"></label>
          </div>
          <label class="admin-field" for="contentFormat"><span>開催形式</span><input id="contentFormat" name="format" type="text" placeholder="オンライン（Zoom）"></label>
          <label class="admin-field" for="contentAudience"><span>対象</span><input id="contentAudience" name="audience" type="text"></label>
          <label class="admin-field" for="contentInstructor"><span>講師</span><input id="contentInstructor" name="instructor" type="text"></label>
          <label class="admin-field" for="contentAgenda"><span>アジェンダ <small>1行につき1項目</small></span><textarea id="contentAgenda" name="agenda" rows="5"></textarea></label>
          <label class="admin-field" for="contentLinkUrl"><span>参加・詳細URL</span><input id="contentLinkUrl" name="linkUrl" type="url" placeholder="https://..."></label>
          <label class="admin-field" for="contentImage"><span>画像サムネイル <small>PCから選択・1.5MB以下</small></span><input id="contentImage" name="imageFile" type="file" accept="image/*"></label>
          <div class="admin-image-preview"><img id="contentImagePreview" alt="選択した画像のプレビュー" hidden><button id="contentImageRemove" type="button" hidden>画像を外す</button></div>
          <label class="admin-visibility admin-visibility--notice"><input name="postToNotice" type="checkbox"><span><b>お知らせにも投稿する</b><small>タイトルと概要をお知らせへ掲載し、セミナーページへリンクします</small></span></label>
          <div class="admin-schedule-fields">
            <label class="admin-field" for="contentStartAt"><span>公開開始日時 <small>任意</small></span><input id="contentStartAt" name="startAt" type="datetime-local"></label>
            <label class="admin-field" for="contentEndAt"><span>公開終了日時 <small>任意・空欄は無期限</small></span><input id="contentEndAt" name="endAt" type="datetime-local"></label>
          </div>
          <label class="admin-visibility"><input name="visible" type="checkbox" checked><span><b>サイトに表示する</b><small>オフにすると公開期間内でも非表示になります</small></span></label>
          <div class="admin-form-actions">
            <button class="admin-submit" type="submit"><span id="contentSubmitLabel">投稿を追加</span> →</button>
            <button class="admin-cancel" id="contentCancel" type="button" hidden>キャンセル</button>
          </div>
        </form>
      </section>
      <section class="admin-panel admin-panel--list">
        <div class="admin-list-head"><div><small>REGISTERED CONTENT</small><h2>登録済みセミナー <span id="contentCount">0 / 5件</span></h2></div></div>
        <div class="admin-company-list" id="contentList" aria-live="polite"></div>
      </section>
    </div>
    <div class="admin-message" id="adminMessage" role="status" hidden></div>
  </main>
<script src="js/content-store.js"></script>
<script src="js/admin-content.js"></script>
</body>
</html>
