<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="弁護士・税理士・不動産の専門家相談窓口を選べます。">
<title>専門家相談 | rally 資産形成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="lg-expert-body">

  <header class="lg-expert-header">
    <a class="lg-expert-header__logo" href="dashboard.html" aria-label="会員ホームへ戻る">
      <img class="is-company-logo" src="images/rally-logo.png" data-site-logo alt="rally 資産形成">
    </a>
    <a class="lg-expert-header__back" href="dashboard.html"><span aria-hidden="true">←</span> ホームに戻る</a>
  </header>

  <main class="lg-expert-main">
    <section class="lg-expert-intro">
      <div class="lg-expert-intro__label"><i aria-hidden="true"></i> PROFESSIONAL CONSULTATION</div>
      <h1>相談したい専門家を<br><em>お選びください。</em></h1>
      <p>法律・税務・不動産の悩みに、それぞれの専門家が対応します。<br>内容に近い窓口からお進みください。</p>
      <div class="lg-expert-intro__fee">
        <strong>初回相談料無料</strong>
        <small>※不動産相談は何度でも無料です</small>
      </div>
      <div class="lg-expert-intro__assurance">
        <div class="lg-expert-intro__trust">
          <span>相談内容は秘密厳守</span>
          <span>専門窓口へ直接接続</span>
          <span>オンライン申し込み</span>
        </div>
        <p class="lg-expert-intro__privacy">※各種相談内容は会社及び第三者へ漏れることはありません</p>
      </div>
    </section>

    <section class="lg-expert-grid" id="expertCards" aria-label="専門家相談窓口" aria-live="polite"></section>

    <p class="lg-expert-footnote">各ボタンを押すと、提携先の申し込みページをrally 資産形成内に表示します。</p>
  </main>

<script src="js/content-store.js"></script>
<script src="js/expert.js"></script>

<script src="js/company-logo.js"></script>
<script src="js/member-branding.js"></script>
